name: Release please

# On each push to main, release-please keeps a release pull request open with
# the apps' next version and changelog, from the Conventional Commits since
# their last release. Merging it tags the apps (v<version>) and creates their
# GitHub release. This workflow runs every check (check.yml) on the pushed
# commit, marks it with a "Checks" status saying how they ended, and once
# they passed deploys it to shawared.com (web.yml). When release-please tags
# the apps, it releases them to the stores (release.yml) from the commit it
# tagged, once that commit's checks passed: the pushed one, or an earlier one
# when the run for the release pull request's merge tagged nothing (it
# failed, say) and this run tagged it, which then gets its own checks and
# status.
#
# Each builds exactly its commit. See docs/releasing.md and
# docs/web-deployment.md.
#
# Tags made with GITHUB_TOKEN start no workflows, so this workflow calls the
# release workflows itself, and their jobs run as this workflow on main. The
# vault knows them by this file's name and serves each its own secrets only in
# runs Ali (AliOsm) started. When someone else pushes, the checks still run and
# nothing ships; a note says so. Re-running doesn't help, as a re-run keeps the
# pusher's identity: Ali runs Release web on main, and Release apps (dry-run
# unticked) on the v tag, instead.
#
# Run by hand with access-check ticked, it releases nothing and only checks
# that the vault gives release.yml's and web.yml's jobs their own secrets and
# refuses them each other's, Mofied's and the audio upload keys.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      access-check:
        description: Only check the vault's rules for the release workflows; release nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release please
    if: github.ref == 'refs/heads/main' && !inputs.access-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time, each in turn: queue: max keeps up to 100 waiting,
    # where GitHub would cancel all but the newest, and a run cancelled
    # before release-please tags the release pull request's merge leaves the
    # tag to a later push's run.
    concurrency:
      group: release-please
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      apps: ${{ steps.release.outputs['apps/app--release_created'] }}
      apps-tag: ${{ steps.release.outputs['apps/app--tag_name'] }}
      apps-sha: ${{ steps.apps.outputs.sha }}
      apps-apart: ${{ steps.apps.outputs.apart }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      # The commit the apps release ships: the one release-please tagged,
      # which is an earlier one than the pushed commit when this run tagged a
      # release pull request's merge that an earlier run didn't.
      - name: Pick the apps' commit
        id: apps
        if: steps.release.outputs['apps/app--release_created'] == 'true'
        env:
          APPS_SHA: ${{ steps.release.outputs['apps/app--sha'] }}
        run: |
          if ! [[ $APPS_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release-please tagged the apps without a full commit SHA ($APPS_SHA)."
            exit 1
          fi
          echo "sha=$APPS_SHA" >> "$GITHUB_OUTPUT"
          if [ "$APPS_SHA" = "$GITHUB_SHA" ]; then
            echo "apart=false" >> "$GITHUB_OUTPUT"
            echo "The apps release from the pushed commit, $APPS_SHA."
          else
            echo "apart=true" >> "$GITHUB_OUTPUT"
            echo "The apps release from $APPS_SHA, which release-please tagged; the site deploys the pushed $GITHUB_SHA."
          fi

  # The checks GitHub starts on GITHUB_TOKEN's pull requests wait for someone
  # to approve them, and the release pull request needs none: its merge is
  # checked on main before anything ships. So this job keeps its bun.lock in
  # step with its versions and checks that the apps version it brings can be
  # released (its store release notes), as the "Release check" status.
  release-pr:
    name: Release pull request
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the release pull request
        id: pr
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json number,headRefName --jq '.[0] // empty | "number=\(.number)\nbranch=\(.headRefName)"' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.number
        with:
          ref: ${{ steps.pr.outputs.branch }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.pr.outputs.number
        with:
          bun-version: 1.4.4
      # Resolves the lockfile only: no packages are installed and no package
      # scripts run.
      - name: Update bun.lock
        if: steps.pr.outputs.number
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          bun install --lockfile-only --ignore-scripts
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already has the release's versions."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --quiet -m "chore: update bun.lock to the release's versions" -- bun.lock
            git push --quiet origin "HEAD:$BRANCH"
          fi
      # The release check comes from ieasybooks/release, pinned in bun.lock;
      # nothing else is needed, so no lifecycle scripts run.
      - name: Install the release tool
        if: steps.pr.outputs.number
        run: bun install --frozen-lockfile --ignore-scripts
      # Against main as the merge will be: main's store folder, with the
      # pull request's apps version.
      - name: Check the apps can be released
        if: steps.pr.outputs.number
        run: |
          head=$(git rev-parse HEAD)
          git fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet "$GITHUB_SHA"
          released=$(jq -r .version apps/app/package.json)
          git checkout --quiet "$head" -- apps/app/package.json
          version=$(jq -r .version apps/app/package.json)
          if [ "$version" = "$released" ]; then
            state=success
            description="This release leaves the apps at $version."
            echo "$description" > check.log
          elif ./node_modules/.bin/ieasybooks-release store check --app apps/app > check.log 2>&1; then
            state=success
            description=$(tail -1 check.log)
          else
            state=failure
            description=$(sed -n 2p check.log | sed 's/^ *- //')
          fi
          cat check.log
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" \
            -f state="$state" -f context="Release check" \
            -f description="${description:0:140}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

  # Every check, on the pushed commit, which the site deploys. It doesn't
  # wait for release-please, so a push is checked and deployed even when
  # release-please fails.
  check:
    name: Check
    if: github.ref == 'refs/heads/main' && !inputs.access-check
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      sha: ${{ github.sha }}

  # Every check on the apps' commit, when release-please tagged an earlier
  # commit than the pushed one.
  apps-check:
    name: Check the apps' commit
    needs: release-please
    if: needs.release-please.outputs.apps-apart == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      sha: ${{ needs.release-please.outputs.apps-sha }}

  # Marks each checked commit with how its checks ended, as its "Checks"
  # status, which Release web run by hand and a release from a tag pushed by
  # hand need (ieasybooks-release verify-commit). It runs however they ended,
  # also on a re-run, so a later run whose checks failed or was cancelled
  # takes an earlier success back.
  checks-status:
    name: Mark the commits' checks
    needs: [release-please, check, apps-check]
    if: ${{ always() && needs.check.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
          APPS_APART: ${{ needs.release-please.outputs.apps-apart }}
          APPS_SHA: ${{ needs.release-please.outputs.apps-sha }}
          APPS_RESULT: ${{ needs.apps-check.result }}
        run: |
          mark() {
            case $2 in
              success) state=success description="Every check passed on main." ;;
              failure) state=failure description="A check failed on main." ;;
              *) state=error description="Main's checks didn't finish ($2)." ;;
            esac
            gh api "repos/$GITHUB_REPOSITORY/statuses/$1" \
              -f state="$state" -f context=Checks \
              -f description="$description" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
            echo "Marked $1: $description"
          }
          mark "$GITHUB_SHA" "$RESULT"
          if [ "$APPS_APART" = true ]; then
            mark "$APPS_SHA" "$APPS_RESULT"
          fi
      - name: Note that nothing ships
        if: github.actor != 'AliOsm'
        env:
          ACTOR: ${{ github.actor }}
          RESULT: ${{ needs.check.result }}
          APPS: ${{ needs.release-please.outputs.apps }}
          APPS_APART: ${{ needs.release-please.outputs.apps-apart }}
          APPS_RESULT: ${{ needs.apps-check.result }}
          TAG: ${{ needs.release-please.outputs.apps-tag }}
        run: |
          if [ "$RESULT" = success ]; then
            echo "::notice::$ACTOR started this run, so it doesn't deploy $GITHUB_SHA: the vault serves the deploy token only in runs AliOsm started. AliOsm can run Release web on main to deploy main's newest commit."
          fi
          # The apps' commit's checks: this run's, or its own.
          apps_result=$RESULT
          if [ "$APPS_APART" = true ]; then
            apps_result=$APPS_RESULT
          fi
          if [ "$APPS" = true ] && [ "$apps_result" = success ]; then
            echo "::notice::$ACTOR started this run, so it doesn't release the apps' $TAG: AliOsm can run Release apps on $TAG with dry-run unticked."
          fi

  web:
    name: Release web
    needs: check
    if: github.actor == 'AliOsm'
    permissions:
      contents: read
      id-token: write
      statuses: read
    uses: ./.github/workflows/web.yml
    with:
      sha: ${{ github.sha }}

  # From the commit release-please tagged, once that commit's own checks
  # passed: this run's, or the apps' commit's when it's an earlier one.
  apps:
    name: Release apps
    needs: [release-please, check, apps-check]
    if: >-
      ${{ !cancelled() && github.actor == 'AliOsm' && needs.release-please.outputs.apps == 'true' &&
      ((needs.release-please.outputs.apps-apart == 'true' && needs.apps-check.result == 'success') ||
      (needs.release-please.outputs.apps-apart != 'true' && needs.check.result == 'success')) }}
    permissions:
      contents: read
      id-token: write
      statuses: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.apps-tag }}
      sha: ${{ needs.release-please.outputs.apps-sha }}

  # The vault access checks, run by hand on main (see the top).
  access-check-apps:
    name: Vault access check (apps)
    if: github.ref == 'refs/heads/main' && inputs.access-check
    permissions:
      contents: read
      id-token: write
      statuses: read
    uses: ./.github/workflows/release.yml
    with:
      access-check: true

  access-check-web:
    name: Vault access check (web)
    if: github.ref == 'refs/heads/main' && inputs.access-check
    permissions:
      contents: read
      id-token: write
      statuses: read
    uses: ./.github/workflows/web.yml
    with:
      access-check: true
